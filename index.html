<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>ホテル シフト管理</title>

  <!-- Webアプリ設定 -->
  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <!-- Safari / iPhone ホーム画面用アイコン -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./hotel-shift-icon-180.png"
  >

  <!-- ブラウザ用アイコン -->
  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./hotel-shift-icon-192.png"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="シフト管理"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    #gasApp {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>

  <iframe
    id="gasApp"
    title="ホテル シフト管理"
  ></iframe>

  <script>
    const GAS_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxFosVOrMTscGWBpaxEV06H3JGJNlL-_zyNUJNoqarzotZcca5FLuKIRVJkRArvvvJ1rQ/exec';

    const query = window.location.search;

    document.getElementById('gasApp').src =
      GAS_WEB_APP_URL + query;
  </script>

</body>
</html>
